name: commitmentos

# Everything published to the host is bound to 127.0.0.1 only.

# n8n keeps its workflows/executions in its own database on the same Postgres server.
x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: ${POSTGRES_USER:-commitmentos}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh first}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./scripts/init-env.sh first}
  GENERIC_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
  TZ: ${DEFAULT_TIMEZONE:-UTC}
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_TEMPLATES_ENABLED: "false"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commitmentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/init-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:-commitmentos}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local SMTP sink + web UI: every notification email lands here (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_MODE: ${DEMO_MODE:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-commitmentos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-commitmentos}
      JWT_SECRET: ${JWT_SECRET:?run ./scripts/init-env.sh first}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      N8N_INBOUND_SECRET: ${N8N_INBOUND_SECRET:?run ./scripts/init-env.sh first}
      N8N_OUTBOUND_SECRET: ${N8N_OUTBOUND_SECRET:?run ./scripts/init-env.sh first}
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_TRANSIENT_RETRIES: ${LLM_MAX_TRANSIENT_RETRIES:-2}
      LLM_MAX_REPAIR_ATTEMPTS: ${LLM_MAX_REPAIR_ATTEMPTS:-1}
      CONFIDENCE_HIGH: ${CONFIDENCE_HIGH:-0.85}
      CONFIDENCE_MEDIUM: ${CONFIDENCE_MEDIUM:-0.60}
      REMINDER_OFFSETS_HOURS: ${REMINDER_OFFSETS_HOURS:-24,6}
      ESCALATE_AFTER_HOURS: ${ESCALATE_AFTER_HOURS:-24}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      BUSINESS_DAY_END: ${BUSINESS_DAY_END:-17:00}
      DEFAULT_DATE_ORDER: ${DEFAULT_DATE_ORDER:-MDY}
      NOTIFY_FROM_EMAIL: ${NOTIFY_FROM_EMAIL:-commitmentos@localhost}
      CALENDAR_PROVIDER: ${CALENDAR_PROVIDER:-local}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_REGISTER_PER_HOUR: ${RATE_LIMIT_REGISTER_PER_HOUR:-10}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-600}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job: loads credentials (generated from env, never committed) and workflows into n8n's database
  # BEFORE n8n starts, so the workflows come up active and wired with no manual clicking.
  n8n-import:
    image: n8nio/n8n:2.40.6
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *n8n-env
      # consumed only by make-credentials.js to build the credential objects
      N8N_INBOUND_SECRET: ${N8N_INBOUND_SECRET:?run ./scripts/init-env.sh first}
      N8N_OUTBOUND_SECRET: ${N8N_OUTBOUND_SECRET:?run ./scripts/init-env.sh first}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./automation/n8n:/automation:ro
    entrypoint: ["/bin/sh", "/automation/import.sh"]

  n8n:
    image: n8nio/n8n:2.40.6
    restart: unless-stopped
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      <<: *n8n-env
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      # n8n keeps each execution's data (which includes message text) so runs can be inspected and retried. Keep it short,
      # and for a real mailbox set N8N_SAVE_SUCCESS_EXECUTIONS=none so that successful runs leave no message content behind.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${N8N_SAVE_SUCCESS_EXECUTIONS:-all}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-72}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

volumes:
  pgdata:
