[project]
name = "commitmentos-api"
version = "0.1.0"
description = "CommitmentOS API: commitment detection + obligation lifecycle backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the full docker-compose stack (n8n, api, mailpit) to be running",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]  # assert in tests / FastAPI Depends() defaults are idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501"]  # long assertions/data are more readable unwrapped
"alembic/**" = ["E501"]
"app/services/deadlines.py" = ["E501", "SIM108", "SIM114"]
"app/services/extraction/*.py" = ["E501"]  # long prompt / schema description strings
"app/services/ingestion.py" = ["E501"]  # explicit branches read better than ternaries here
